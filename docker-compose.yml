services:
  # =========================
  # PostgreSQL
  # =========================
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  # =========================
  # pgAdmin
  # =========================
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      
    ports:
      - "${PGADMIN_LISTEN_PORT:-8080}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - app

  # =========================
  # Backend
  # =========================
  backend:
    build:
      context: ./backend
    image: ghcr.io/${GHCR_OWNER:-your-github-username}/film-react-nest-backend:${IMAGE_TAG:-latest}
    container_name: backend
    restart: unless-stopped

    environment:
      DATABASE_DRIVER: ${DATABASE_DRIVER}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    depends_on:
        postgres:
          condition: service_healthy

    ports:
      - "${PORT:-3000}:3000"

    networks:
      - app

  # =========================
  # Frontend
  # =========================
  frontend:
    build:
      context: ./frontend
    image: ghcr.io/${GHCR_OWNER:-your-github-username}/film-react-nest-frontend:${IMAGE_TAG:-latest}
    container_name: frontend
    restart: on-failure
    volumes:
      - frontend_dist:/shared
    command: sh -c "cp -r /app/dist/* /shared"
    networks:
      - app

  # =========================
  # Nginx
  # =========================
  nginx:
    build:
      context: ./nginx
    image: ghcr.io/${GHCR_OWNER:-your-github-username}/film-react-nest-nginx:${IMAGE_TAG:-latest}
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${NGINX_LISTEN_PORT:-80}:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - app

# =========================
# Volumes
# =========================
volumes:
  postgres_data:
  pgadmin_data:
  frontend_dist:

# =========================
# Network
# =========================
networks:
  app:
    driver: bridge
